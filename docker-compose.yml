services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: explorae-backend
    restart: always
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST
      - DB_PORT
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
      - DB_SSL_MODE
      - JWT_SECRET
      - JWT_EXPIRATION
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - EXPO_PUBLIC_API_URL=${API_URL:-http://137.131.135.59:8080}
    container_name: explorae-frontend
    restart: always
    expose:
      - "80"
    networks:
      - explorae-network

networks:
  explorae-network:
    driver: bridge
