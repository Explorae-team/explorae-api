services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: explorae-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - explorae-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - EXPO_PUBLIC_API_URL=${API_URL:-http://137.131.135.59:8080}
    container_name: explorae-frontend
    restart: always
    ports:
      - "80:80"
    networks:
      - explorae-network

networks:
  explorae-network:
    driver: bridge
