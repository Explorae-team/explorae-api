services:
  db:
    image: postgres:15-alpine
    container_name: explorae-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-explorae_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - explorae_data:/var/lib/postgresql/data

volumes:
  explorae_data:
