services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: explorae-backend
    restart: always
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST
      - DB_PORT
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
      - DB_SSL_MODE
      - JWT_SECRET
      - JWT_EXPIRATION
      - CORS_ALLOWED_ORIGINS
      - SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL}}
      - SUPABASE_KEY
    networks:
      - coolify

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL}
        - EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}
        - EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}
        - EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY}
    container_name: explorae-frontend
    restart: always
    expose:
      - "80"
    networks:
      - coolify

networks:
  coolify:
    name: coolify
    external: true
